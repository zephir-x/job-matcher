name: Daily Job Matcher AI Agent

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4:00 AM UTC (6:00 AM CEST)
  workflow_dispatch: # It allows you to manually launch the agent from the browser

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore JobMatcher.sln

      - name: Inject Candidate Profile from Secrets
        working-directory: ./src/JobMatcher
        env:
          SECRET_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: echo "$SECRET_PROFILE" > profile.json

      - name: Run Job Matcher Agent
        working-directory: ./src/JobMatcher
        run: dotnet run
        env:
          DOTNET_ENVIRONMENT: Development
          TargetKeywords: ${{ secrets.TARGET_KEYWORDS }}
          TargetRoles: ${{ secrets.TARGET_ROLES }}
          AI__ApiKey: ${{ secrets.GEMINI_API_KEY }}
          AI__Model: ${{ secrets.AI_MODEL }}
          Notifications__DiscordWebhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}